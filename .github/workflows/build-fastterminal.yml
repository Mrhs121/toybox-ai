name: Build FastTerminal

on:
  push:
    paths:
      - 'fastTerminal/**'
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Build debug APK
        working-directory: fastTerminal
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastTerminal-debug
          path: fastTerminal/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
